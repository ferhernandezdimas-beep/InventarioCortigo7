services:
  - type: web
    name: cortijo7
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/ferhernandezdimas-beep/InventarioCortigo7
    branch: main
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /health/ready
    autoDeployTrigger: off
    envVars:
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cortijo7-postgres
          property: connectionString
databases:
  - name: cortijo7-postgres
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: cortijo7_db
    user: cortijo7
    ipAllowList: []
