name: cortijo7-test
services:
  postgres-test:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: cortijo7_test
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: cortijo7_test
      TZ: UTC
    ports: ["127.0.0.1:55437:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U cortijo7_test -d cortijo7_test]
      interval: 2s
      timeout: 3s
      retries: 30
