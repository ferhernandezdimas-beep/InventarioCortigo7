pid /tmp/cortijo7-nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/c7-client-body;
    proxy_temp_path /tmp/c7-proxy;
    fastcgi_temp_path /tmp/c7-fastcgi;
    uwsgi_temp_path /tmp/c7-uwsgi;
    scgi_temp_path /tmp/c7-scgi;
    map $http_x_forwarded_proto $forwarded_scheme {
        default $http_x_forwarded_proto;
        "" $scheme;
    }
    map $http_x_forwarded_for $forwarded_client {
        default $http_x_forwarded_for;
        "" $remote_addr;
    }
    server {
        listen __PORT__;
        server_name _;
        client_max_body_size 2m;
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $forwarded_client;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;
            proxy_read_timeout 50s;
        }
    }
}
