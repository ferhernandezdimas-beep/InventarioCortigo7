name: PostgreSQL checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: cortijo7_test
          POSTGRES_USER: cortijo7_test
          POSTGRES_PASSWORD: local-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cortijo7_test -d cortijo7_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cortijo7_test:local-test-only@127.0.0.1:5432/cortijo7_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.lock
      - run: ruff check app tests scripts/start_render.py
      - run: python -m pytest -q -W error
