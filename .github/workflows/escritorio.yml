name: Cortijo 7 escritorio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['escritorio/**', '.github/workflows/escritorio.yml']
  pull_request:
    paths: ['escritorio/**', '.github/workflows/escritorio.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run build:win
            artifact: Cortijo7-Windows
          - os: macos-latest
            command: npm run build:mac
            artifact: Cortijo7-macOS
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: escritorio
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: escritorio/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            escritorio/dist/*.exe
            escritorio/dist/*.dmg
          if-no-files-found: error
          retention-days: 30
